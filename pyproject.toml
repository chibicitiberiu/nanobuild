[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "ninja_syntax"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/nanobuild"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ninja_syntax"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Submodule build scripts receive `env` and `targets` injected at runtime by import_file().
"examples/submodules/*/build.py" = ["F821"]

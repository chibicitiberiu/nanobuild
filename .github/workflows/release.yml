name: release

# Manually-triggered release. Start it from the Actions tab ("Run workflow"). It tests, builds and
# publishes the version in the VERSION file to PyPI; only *after* publishing succeeds does it create
# the v<version> tag + GitHub release and roll the changelog. The tag is the record of a successful
# release, not its trigger.
#
# Publishing uses PyPI "trusted publishing" (OIDC) — no API token/secret is stored in GitHub.
# One-time setup on PyPI (https://pypi.org/manage/project/nanobuild/settings/publishing/):
#   - Publisher:        GitHub
#   - Owner:            chibicitiberiu
#   - Repository:       nanobuild
#   - Workflow name:    release.yml
#   - Environment:      pypi
#
# To cut a release:
#   1. Set the version in the VERSION file (single source of truth) and add notes to CHANGELOG.md.
#   2. Commit & push to master.
#   3. Actions tab -> "release" -> "Run workflow".
#
# (If you'd rather use an API token than trusted publishing, see the commented `password:` line in
#  the publish job and add a PYPI_API_TOKEN repository secret.)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Ensure this version has not already been released
        run: |
          VERSION="$(cat VERSION)"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — bump the VERSION file before releasing."
            exit 1
          fi

      - name: Install build and test dependencies
        run: python -m pip install -e ".[test]" build

      - name: Run tests
        run: python -m pytest -ra

      - name: Stamp build info (run number + commit)
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "BUILD = \"${GITHUB_RUN_NUMBER}+g${SHORT_SHA}\"" > src/nanobuild/_buildinfo.py
          cat src/nanobuild/_buildinfo.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m pip install twine && python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To use an API token instead of trusted publishing, uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  record:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + GitHub release and push the changelog rotation
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare release notes and roll the changelog
        run: python scripts/release_changelog.py "$VERSION" --notes release_notes.md

      - name: Create the tag and GitHub release
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION} (build ${GITHUB_RUN_NUMBER}, g${SHORT_SHA})" \
            --notes-file release_notes.md

      - name: Commit the changelog rotation
        run: |
          rm -f release_notes.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG_HISTORY.md
          git commit -m "Roll changelog for v$VERSION [skip ci]"
          git push origin HEAD:master

name: release

# Publishes the package to PyPI when a version tag (e.g. v0.4) is pushed.
#
# Publishing uses PyPI "trusted publishing" (OIDC) — no API token/secret is stored in GitHub.
# One-time setup on PyPI (https://pypi.org/manage/project/nanobuild/settings/publishing/):
#   - Publisher:        GitHub
#   - Owner:            chibicitiberiu
#   - Repository:       nanobuild
#   - Workflow name:    release.yml
#   - Environment:      pypi
#
# To cut a release: bump `version` in setup.cfg, commit, then tag and push:
#   git tag v0.4 && git push origin v0.4
#
# (If you'd rather use an API token instead of trusted publishing, see the commented
#  `password:` line in the publish job and add a PYPI_API_TOKEN repository secret.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install -e ".[test]" build

      - name: Run tests
        run: python -m pytest -ra

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import configparser; c=configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")"
          echo "tag version: $TAG | package version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match setup.cfg version $PKG"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m pip install twine && python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To use an API token instead of trusted publishing, uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

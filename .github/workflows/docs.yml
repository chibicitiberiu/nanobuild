name: docs

# Builds the MkDocs site and deploys it to the gh-pages branch.
# One-time setup: in the repo Settings -> Pages, set the source to the "gh-pages" branch.

on:
  push:
    branches: [master]
    paths:
      - "doc/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: python -m pip install mkdocs-material

      - name: Build and deploy
        run: mkdocs gh-deploy --force
